name = "senna-luca-strijders-dev"
main = "worker/index.ts"
compatibility_date = "2026-08-19"

[vars]
APP_ENV = "development"
CLIENT_ORIGIN = "http://localhost:3000"
ROOM_ID = "main"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[env.preview]
name = "senna-luca-strijders-preview"

[env.preview.vars]
APP_ENV = "preview"
CLIENT_ORIGIN = "https://preview.example.invalid"
ROOM_ID = "gate-20260819"

[[env.preview.durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[env.production]
name = "senna-luca-strijders-production"

[env.production.vars]
APP_ENV = "production"
CLIENT_ORIGIN = "https://senna-luca-stijders.vercel.app"
ROOM_ID = "main"

[[env.production.durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"
