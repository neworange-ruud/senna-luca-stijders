<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Senna &amp; Luca Strijden</title>
  <desc id="description">Titelillustratie van Senna en Luca in een kleurrijke platformarena met een schatkist, schuimzwaard, speelgoedblaster, hartjes en verschillende fantasiewerelden.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132b55"/>
      <stop offset="0.42" stop-color="#4d3c7c"/>
      <stop offset="0.72" stop-color="#de675d"/>
      <stop offset="1" stop-color="#ffc66d"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff5bd" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#ffd16a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff9a62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="islandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f08c"/>
      <stop offset="1" stop-color="#77ae6a"/>
    </linearGradient>
    <linearGradient id="islandRock" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#6e594e"/>
      <stop offset=".55" stop-color="#3d3942"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf55"/>
      <stop offset="1" stop-color="#bd5c2e"/>
    </linearGradient>
    <linearGradient id="teleport" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79fff0"/>
      <stop offset=".5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#ef74ff"/>
    </linearGradient>
    <linearGradient id="sennaSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff796c"/>
      <stop offset="1" stop-color="#b73055"/>
    </linearGradient>
    <linearGradient id="lucaSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d8de"/>
      <stop offset="1" stop-color="#2374ad"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="14"/>
      <feColorMatrix values="0 0 0 0 0.03 0 0 0 0 0.05 0 0 0 0 0.12 0 0 0 .55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" filter="url(#paper)">
    <!-- Layered twilight sky -->
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1285" cy="234" r="330" fill="url(#sunGlow)"/>
    <circle cx="1288" cy="224" r="102" fill="#ffeab1" opacity=".92"/>
    <path d="M1187 220c37-18 71-27 101-27s64 9 101 27" fill="none" stroke="#f9bc71" stroke-width="7" opacity=".35"/>

    <!-- Stars and a distant space world -->
    <g fill="#fff5c9">
      <circle cx="92" cy="102" r="3"/><circle cx="157" cy="184" r="2"/><circle cx="236" cy="81" r="4"/>
      <circle cx="337" cy="158" r="2"/><circle cx="1397" cy="91" r="3"/><circle cx="1496" cy="162" r="2"/>
      <path d="M418 77l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
      <path d="M1136 92l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    </g>
    <g transform="translate(84 205) rotate(-11)">
      <circle r="76" fill="#65b7a2" stroke="#10182e" stroke-width="8"/>
      <path d="M-65-25c36-12 56 7 73 2 18-6 28-24 51-13 13 6 15 26 9 42-23-14-38 3-58-2-25-6-39-22-75-5z" fill="#d8e487" opacity=".8"/>
      <ellipse rx="112" ry="25" fill="none" stroke="#f6a85e" stroke-width="12"/>
      <ellipse rx="112" ry="25" fill="none" stroke="#ffd579" stroke-width="4"/>
    </g>

    <!-- Distant city and construction silhouettes -->
    <g opacity=".88" stroke="#171f38" stroke-width="7" stroke-linejoin="round">
      <path d="M0 562h88V432h77v130h47V376h92v186h56V461h77v101h50V406h92v156H0z" fill="#273653"/>
      <path d="M1050 558h67V429h66v129h45V356h77v202h44V451h82v107h49V390h120v168z" fill="#3b344b"/>
      <path d="M1084 423v-174h14v174m-7-166h236m-80 0v45m-148-15l-61 50" fill="none"/>
      <path d="M1327 247l-35-18v36z" fill="#f5bb5e"/>
    </g>
    <g fill="#ffd77c" opacity=".72">
      <rect x="33" y="466" width="16" height="24"/><rect x="115" y="478" width="18" height="22"/>
      <rect x="244" y="412" width="17" height="27"/><rect x="401" y="491" width="15" height="23"/>
      <rect x="1248" y="395" width="17" height="27"/><rect x="1455" y="435" width="18" height="24"/>
    </g>

    <!-- Sea, boat and beach edge -->
    <path d="M0 550c181-39 309 38 470 5 145-30 271-18 402 8 132 26 255-27 380-8 127 20 226 24 348-11v356H0z" fill="#174b69"/>
    <path d="M0 583c183-38 318 37 481 1 162-35 284 12 396 24 133 14 225-37 373-14 127 20 231 18 350-10" fill="none" stroke="#55c8c2" stroke-width="17" opacity=".65"/>
    <g transform="translate(1395 485) rotate(3)" stroke="#17192c" stroke-width="6" stroke-linejoin="round">
      <path d="M-77 12H73L46 58H-48z" fill="#e7684f"/>
      <path d="M0 12v-101" fill="none"/>
      <path d="M5-83l70 69H5z" fill="#ffe096"/>
      <path d="M-5-65l-46 50h46z" fill="#69c5cf"/>
    </g>

    <!-- Floating arena -->
    <ellipse cx="800" cy="835" rx="672" ry="56" fill="#091326" opacity=".55"/>
    <g stroke="#161a2c" stroke-linejoin="round">
      <path d="M105 661c123-50 220-18 319-43 121-31 213-61 340-28 126 33 213 0 332 22 136 25 234-4 399 51l-75 116c-28 44-67 74-117 84-246 48-778 38-1025-4-55-9-95-36-124-82z" fill="url(#islandRock)" stroke-width="12"/>
      <path d="M105 661c123-50 220-18 319-43 121-31 213-61 340-28 126 33 213 0 332 22 136 25 234-4 399 51l-31 51c-190-24-307 4-434-16-135-21-221 13-351-16-123-28-213 17-328 20-86 3-146-10-201 7z" fill="url(#islandTop)" stroke-width="12"/>
      <path d="M235 743l46 88 47-101 51 118 49-142m124 31l49 130 55-160 55 168m187-158l51 154 62-147 40 129m173-116l43 104 45-122" fill="none" stroke="#24283b" stroke-width="8" opacity=".65"/>
    </g>

    <!-- Raised platforms -->
    <g stroke="#161a2c" stroke-width="8" stroke-linejoin="round">
      <path d="M116 557h260l-24 54H143z" fill="#cf8a4f"/>
      <path d="M116 557h260v17H116z" fill="#f4d076"/>
      <path d="M1224 533h262l-25 55h-212z" fill="#b66d45"/>
      <path d="M1224 533h262v17h-262z" fill="#f1c866"/>
    </g>
    <g stroke="#15182b" stroke-width="7">
      <path d="M178 557l34-70h68l34 70" fill="#54606b"/>
      <path d="M1283 533l30-73h86l30 73" fill="#54535f"/>
    </g>

    <!-- Teleporter pads -->
    <g fill="none" stroke="url(#teleport)" filter="url(#softGlow)">
      <ellipse cx="256" cy="703" rx="102" ry="30" stroke-width="13"/>
      <ellipse cx="1340" cy="692" rx="102" ry="30" stroke-width="13"/>
    </g>
    <g fill="none" stroke="#c9fff6" stroke-width="4" stroke-dasharray="14 12">
      <ellipse cx="256" cy="703" rx="76" ry="20"/>
      <ellipse cx="1340" cy="692" rx="76" ry="20"/>
    </g>

    <!-- Central supply chest -->
    <g transform="translate(800 624) rotate(-2)" filter="url(#shadow)" stroke="#191827" stroke-width="9" stroke-linejoin="round">
      <path d="M-105-27c0-58 45-91 105-91s105 33 105 91v27h-210z" fill="url(#chest)"/>
      <path d="M-118-9h236v118h-236z" fill="#a74d2e"/>
      <path d="M-118-9h236v31h-236z" fill="#e9ae47"/>
      <path d="M-74-106v213M74-106v213" fill="none" stroke="#f0be56" stroke-width="18"/>
      <path d="M-23 7h46v60h-46z" fill="#ffe17a"/>
      <circle cy="34" r="9" fill="#1c2034" stroke="none"/>
    </g>
    <g fill="#fff4a8" filter="url(#softGlow)">
      <path d="M800 462l8 25 25 8-25 8-8 25-8-25-25-8 25-8z"/>
      <path d="M718 511l5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/>
      <path d="M883 526l6 17 17 6-17 6-6 17-6-17-17-6 17-6z"/>
    </g>

    <!-- Senna: cape fighter with foam sword -->
    <g transform="translate(475 566) rotate(-4)" filter="url(#shadow)" stroke="#171827" stroke-linecap="round" stroke-linejoin="round">
      <!-- cape and rear leg -->
      <path d="M-72-28c-59 65-73 146-26 191 39-27 69-43 118-42l23-120z" fill="#73345e" stroke-width="10"/>
      <path d="M-37 120l-48 101 41 16 65-96z" fill="#27365f" stroke-width="12"/>
      <path d="M32 119l45 106 46-13-30-123z" fill="#344979" stroke-width="12"/>
      <path d="M-92 221l50 16" fill="none" stroke="#f2cf82" stroke-width="24"/>
      <path d="M76 224l51-13" fill="none" stroke="#f2cf82" stroke-width="24"/>
      <!-- torso -->
      <path d="M-74-22c20-27 52-41 90-37 49 5 83 37 84 91l-11 101c-38 24-91 20-132 1L-76 36z" fill="url(#sennaSuit)" stroke-width="12"/>
      <path d="M-65 38c53 29 105 26 161-2" fill="none" stroke="#ffb36d" stroke-width="13" opacity=".85"/>
      <path d="M-38 71h108" fill="none" stroke="#f1c45f" stroke-width="15"/>
      <path d="M4-24l22 20L4 21-18-4z" fill="#ffe381" stroke-width="7"/>
      <!-- head -->
      <path d="M-55-104c2-53 34-85 80-82 49 3 79 44 67 97-8 38-37 62-76 60-44-2-73-32-71-75z" fill="#e5a470" stroke-width="12"/>
      <path d="M-57-108c3-59 44-86 89-78 34 6 54 29 61 58-27-19-49-23-72-14-29 12-42 29-78 34z" fill="#553647" stroke-width="11"/>
      <path d="M-59-99c-10-38 5-71 42-91 46-26 99-3 120 44l-17 17c-22-27-49-41-79-33-31 9-43 31-66 63z" fill="#ef5e5f" stroke-width="11"/>
      <path d="M-59-99c31-10 90-11 151 5" fill="none" stroke="#f3ce69" stroke-width="11"/>
      <ellipse cx="-12" cy="-101" rx="7" ry="10" fill="#18213b" stroke="none"/>
      <ellipse cx="51" cy="-99" rx="7" ry="10" fill="#18213b" stroke="none"/>
      <path d="M6-70c17 11 31 10 44-2" fill="none" stroke-width="7"/>
      <!-- sword arm -->
      <path d="M70-7l74 32" fill="none" stroke="#e5a470" stroke-width="30"/>
      <circle cx="151" cy="28" r="17" fill="#e5a470" stroke-width="8"/>
      <path d="M145 23l131-106" fill="none" stroke="#d8f2ef" stroke-width="26"/>
      <path d="M145 23l131-106" fill="none" stroke="#5fd0d3" stroke-width="12"/>
      <path d="M255-101l42-18-16 40z" fill="#f6efc9" stroke-width="8"/>
      <path d="M126 7l36 44" fill="none" stroke="#f0c85a" stroke-width="16"/>
      <!-- guard arm -->
      <path d="M-64 5l-76 55" fill="none" stroke="#e5a470" stroke-width="28"/>
      <path d="M-167 48l50-27 42 75-51 27c-29-13-43-38-41-75z" fill="#66c6c1" stroke-width="10"/>
      <path d="M-142 61l42 27" fill="none" stroke="#d9ffdf" stroke-width="8"/>
    </g>

    <!-- Luca: agile explorer with toy blaster -->
    <g transform="translate(1132 558) rotate(5)" filter="url(#shadow)" stroke="#171827" stroke-linecap="round" stroke-linejoin="round">
      <!-- backpack -->
      <path d="M59-40c52 3 78 39 72 98l-24 65-62-30z" fill="#f0a24d" stroke-width="11"/>
      <!-- legs -->
      <path d="M-42 116l-45 108 44 13 62-102z" fill="#2d4065" stroke-width="12"/>
      <path d="M37 116l57 100 43-22-45-116z" fill="#26395c" stroke-width="12"/>
      <path d="M-94 222l56 15" fill="none" stroke="#f3cf7d" stroke-width="24"/>
      <path d="M92 216l50-25" fill="none" stroke="#f3cf7d" stroke-width="24"/>
      <!-- body -->
      <path d="M-82-23c27-29 57-40 95-35 51 7 82 42 81 94l-9 99c-44 19-91 17-132-2l-37-96z" fill="url(#lucaSuit)" stroke-width="12"/>
      <path d="M-75 47c50 22 106 22 164-1" fill="none" stroke="#c9f6dd" stroke-width="12" opacity=".8"/>
      <path d="M-39 72h105" fill="none" stroke="#f3c956" stroke-width="15"/>
      <circle cx="12" cy="4" r="25" fill="#f4d45d" stroke-width="8"/>
      <path d="M0 4h24M12-8v24" fill="none" stroke="#253455" stroke-width="6"/>
      <!-- head and helmet -->
      <path d="M-63-106c5-53 36-81 81-79 46 2 77 38 70 88-5 42-35 69-76 67-45-2-78-32-75-76z" fill="#d89a69" stroke-width="12"/>
      <path d="M-66-117c4-57 42-88 92-84 48 4 81 39 80 92l-20 17c-6-43-34-66-71-67-37-1-60 16-78 56z" fill="#f2c85f" stroke-width="12"/>
      <path d="M-49-126c30-25 88-25 132 3" fill="none" stroke="#eef8d5" stroke-width="12"/>
      <path d="M-55-111c35-10 93-9 145 7" fill="none" stroke="#213453" stroke-width="9"/>
      <ellipse cx="-13" cy="-99" rx="7" ry="10" fill="#17203b" stroke="none"/>
      <ellipse cx="48" cy="-96" rx="7" ry="10" fill="#17203b" stroke="none"/>
      <path d="M-2-68c17 10 32 8 43-3" fill="none" stroke-width="7"/>
      <!-- blaster arms -->
      <path d="M-67-2l-61 52" fill="none" stroke="#d89a69" stroke-width="29"/>
      <path d="M68 0l-37 51" fill="none" stroke="#d89a69" stroke-width="29"/>
      <g transform="translate(-125 48) rotate(-7)">
        <path d="M-66-17H55l37 25-30 33H-67z" fill="#f29a45" stroke-width="10"/>
        <path d="M-15 39l25 53h45L36 39z" fill="#435b87" stroke-width="10"/>
        <path d="M61-4h54v23H86" fill="#63d8dc" stroke-width="10"/>
        <circle cx="8" cy="10" r="17" fill="#f5d158" stroke-width="7"/>
      </g>
      <!-- foam dart -->
      <path d="M-252 49h-79" fill="none" stroke="#66d8df" stroke-width="17"/>
      <path d="M-336 49l-25-16v32z" fill="#f2c852" stroke-width="7"/>
    </g>

    <!-- Player labels -->
    <g font-family="Trebuchet MS, Arial, sans-serif" font-weight="900" text-anchor="middle" paint-order="stroke" stroke="#15182c" stroke-width="10" stroke-linejoin="round">
      <text x="462" y="836" font-size="45" fill="#ffcf77">SENNA</text>
      <text x="1138" y="836" font-size="45" fill="#8ff1e4">LUCA</text>
    </g>

    <!-- Heart HUD -->
    <g transform="translate(54 348)" stroke="#14182d" stroke-width="6">
      <path d="M0 18C0-6 34-10 43 12 52-10 86-6 86 18c0 22-22 38-43 56C22 56 0 40 0 18z" fill="#ff5f68"/>
      <path d="M104 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#ff8b78"/>
      <path d="M179 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#ff8b78"/>
      <path d="M254 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#ff8b78"/>
    </g>
    <g transform="translate(1546 348) scale(-1 1)" stroke="#14182d" stroke-width="6">
      <path d="M0 18C0-6 34-10 43 12 52-10 86-6 86 18c0 22-22 38-43 56C22 56 0 40 0 18z" fill="#4ee0d0"/>
      <path d="M104 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#82ede1"/>
      <path d="M179 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#82ede1"/>
      <path d="M254 20c0-17 24-20 31-4 6-16 30-13 30 4 0 16-15 27-30 40-16-13-31-24-31-40z" fill="#82ede1"/>
    </g>

    <!-- Graphic title lockup -->
    <g text-anchor="middle" font-family="Trebuchet MS, Arial Black, Arial, sans-serif" font-weight="900" font-style="italic" paint-order="stroke fill" stroke-linejoin="round">
      <text x="806" y="103" font-size="76" letter-spacing="7" fill="#fff0bd" stroke="#14182d" stroke-width="18">SENNA &amp; LUCA</text>
      <text x="800" y="200" font-size="122" letter-spacing="9" fill="#ffb84f" stroke="#14182d" stroke-width="24">STRIJDEN</text>
      <text x="800" y="200" font-size="122" letter-spacing="9" fill="none" stroke="#fff0bd" stroke-width="5">STRIJDEN</text>
    </g>
    <g transform="translate(800 245)">
      <path d="M-246-1h142M104-1h142" stroke="#ffe7a7" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <text y="10" text-anchor="middle" fill="#fff5d2" font-family="Trebuchet MS, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="5">TIEN HARTJES. EEN ARENA.</text>
    </g>

    <!-- Border and corner cuts -->
    <rect x="16" y="16" width="1568" height="868" rx="19" fill="none" stroke="#11172b" stroke-width="16"/>
    <path d="M16 106V16h90M1494 16h90v90M1584 794v90h-90M106 884H16v-90" fill="none" stroke="#ffe099" stroke-width="5"/>
  </g>
</svg>
